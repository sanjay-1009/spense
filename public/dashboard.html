<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Spense</title>

<link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<body>

<div class="page">

<!-- NAVBAR -->
<header class="navbar navbar-expand-md shadow-sm">

<div class="container-xl">

<a class="navbar-brand">

<img src="images/logo.png"
     width="40"
     class="me-2">

<span class="fw-bold">
Spense
</span>

</a>

<div class="ms-auto">

<h4
id="welcomeUser"
class="mb-0">
Welcome
</h4>

</div>
</div>

</header>

<!-- PAGE -->



<!-- ADD BUTTON -->

<div class="mt-4 mb-4">

<button
    class="btn btn-primary mt-3"
    data-bs-toggle="modal"
    data-bs-target="#expenseModal">

    + Add Expense

</button>

</div>

<!-- CHARTS --><div class="row g-3 mt-3">

    <div class="col-md-3">
        <div class="card">
            <div class="card-body">
                <div class="text-secondary">
                    Today Spend
                </div>

                <h2 id="todaySpend">
                    ₹0
                </h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card">
            <div class="card-body">
                <div class="text-secondary">
                    Daily Average
                </div>

                <h2 id="dailyAverage">
                    ₹0
                </h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card">
            <div class="card-body">
                <div class="text-secondary">
                    Weekly Average
                </div>

                <h2 id="weeklyAverage">
                    ₹0
                </h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card">
            <div class="card-body">
                <div class="text-secondary">
                    Monthly Average
                </div>

                <h2 id="monthlyAverage">
                    ₹0
                </h2>
            </div>
        </div>
    </div>

</div>

<div class="row">

<div class="col-lg-8">

<div class="card">

<div class="card-header">

Expense Trend

</div>

<div class="card-body">

<canvas id="expenseChart"></canvas>

</div>

</div>

</div>

<div class="col-lg-4">

<div class="card">

<div class="card-header">

Category Distribution

</div>

<div class="card-body">

<canvas id="pieChart"></canvas>

</div>

</div>

</div>

</div>

<!-- RECENT EXPENSES -->

<div class="card mt-4">

<div class="card-header">

Recent Expenses

</div>

<div class="table-responsive">

<table class="table card-table">

<thead>

<tr>

<th>Date</th>
<th>Food</th>
<th>Travel</th>
<th>CLG</th>
<th>Misc</th>
<th>Total</th>

</tr>

</thead>

<tbody id="expenseTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<!-- ADD EXPENSE MODAL -->



<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>

<script>

document.addEventListener(
"DOMContentLoaded",
function(){

const today =
new Date()
.toISOString()
.split("T")[0];

const dateInput =
document.getElementById(
"expenseDate"
);

if(dateInput){

dateInput.value =
today;

}

});

</script>


<div class="spinner-overlay" id="spinner">

<div class="spinner"></div>

</div>

<div
class="modal fade"
id="expenseModal"
tabindex="-1">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h3>Add Expense</h3>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<form id="expenseForm">

<div class="mb-3">

<label>Date</label>

<input
type="date"
id="expenseDate"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Food</label>

<input
type="number"
id="food"
class="form-control"
value="0">

</div>

<div class="mb-3">

<label>Travel</label>

<input
type="number"
id="travel"
class="form-control"
value="0">

</div>

<div class="mb-3">

<label>College</label>

<input
type="number"
id="clg"
class="form-control"
value="0">

</div>

<div class="mb-3">

<label>Misc</label>

<input
type="number"
id="misc"
class="form-control"
value="0">

</div>

<button
type="submit"
class="btn btn-primary">

Save Expense

</button>

</form>

</div>

</div>

</div>

</div>
<script src="js/dashboard.js"></script>
</body>
</html>
