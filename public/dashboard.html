<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Spense</title>

<link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="page">

<!-- NAVBAR -->
<header class="navbar navbar-expand-md shadow-sm">

<div class="container-xl">

<a class="navbar-brand">

<img src="images/logo.png"
     width="40"
     class="me-2">

<span class="fw-bold">
Spense
</span>

</a>

<div class="ms-auto">

<span class="text-secondary">

Hello, Sanjay 👋

</span>

</div>

</div>

</header>

<!-- PAGE -->

<div class="page-wrapper">

<div class="container-xl py-4">

<!-- CARDS -->

<div class="row">

<div class="col-md-3">

<div class="card stat-card">

<div class="card-body">

<h4>Today's Spend</h4>

<h1>₹450</h1>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card stat-card">

<div class="card-body">

<h4>Monthly Spend</h4>

<h1>₹8,500</h1>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card stat-card">

<div class="card-body">

<h4>Avg / Day</h4>

<h1>₹283</h1>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card stat-card">

<div class="card-body">

<h4>Avg / Month</h4>

<h1>₹8,500</h1>

</div>

</div>

</div>

</div>

<!-- ADD BUTTON -->

<div class="mt-4 mb-4">

<button
class="btn btn-primary btn-lg"
data-bs-toggle="modal"
data-bs-target="#expenseModal">

+ Add Expense

</button>

</div>

<!-- CHARTS -->

<div class="row">

<div class="col-lg-8">

<div class="card">

<div class="card-header">

Expense Trend

</div>

<div class="card-body">

<canvas id="expenseChart"></canvas>

</div>

</div>

</div>

<div class="col-lg-4">

<div class="card">

<div class="card-header">

Category Distribution

</div>

<div class="card-body">

<canvas id="pieChart"></canvas>

</div>

</div>

</div>

</div>

<!-- RECENT EXPENSES -->

<div class="card mt-4">

<div class="card-header">

Recent Expenses

</div>

<div class="table-responsive">

<table class="table card-table">

<thead>

<tr>

<th>Date</th>
<th>Food</th>
<th>Travel</th>
<th>CLG</th>
<th>Misc</th>
<th>Total</th>

</tr>

</thead>

<tbody>

<tr>
<td>10-Jun</td>
<td>150</td>
<td>50</td>
<td>100</td>
<td>30</td>
<td>330</td>
</tr>

<tr>
<td>09-Jun</td>
<td>100</td>
<td>0</td>
<td>200</td>
<td>20</td>
<td>320</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<!-- ADD EXPENSE MODAL -->

<div
class="modal modal-blur fade"
id="expenseModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Add Expense</h5>

</div>

<div class="modal-body">

<input
type="number"
class="form-control mb-3"
placeholder="Food">

<input
type="number"
class="form-control mb-3"
placeholder="Travel">

<input
type="number"
class="form-control mb-3"
placeholder="College">

<input
type="number"
class="form-control mb-3"
placeholder="Misc">

</div>

<div class="modal-footer">

<button
class="btn btn-primary">

Save

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>

<script src="js/dashboard.js"></script>

</body>
</html>
