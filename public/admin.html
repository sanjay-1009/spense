<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/logo.png">
<link rel="apple-touch-icon" href="images/logo.png">
<meta name="theme-color" content="#206bc4">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="page">
<header class="navbar navbar-expand-md shadow-sm">
<div class="container-xl">
<div class="navbar-brand">
<img src="images/logo.png"
     width="40"
     class="me-2">
Spense Admin
</div>
<div class="ms-auto d-flex align-items-center gap-3">
<a href="https://instagram.com/spense_official"
   target="_blank"
   class="text-decoration-none">
📎 @spense_official
</a>
<span class="badge bg-green">
Super Admin
</span>
<button
class="btn btn-danger"
onclick="logout()">
Logout
</button>
</div>
</div>
</header>
<div class="page-wrapper">
<div class="container-xl py-4">
<!-- TOP CARDS -->
<div class="row">
<div class="col-md-3">
<div class="card stat-card">
<div class="card-body">
<h4>Total Users</h4>
<h1 id="totalUsers">0</h1>
</div>
</div>
</div>
<div class="col-md-3">
<div class="card stat-card">
<div class="card-body">
<h4>Active Today</h4>
<h1 id="activeToday">0</h1>
</div>
</div>
</div>
<div class="col-md-3">
<div class="card stat-card">
<div class="card-body">
<h4>Total Records</h4>
<h1 id="totalExpenses">0</h1>
</div>
</div>
</div>
<div class="col-md-3">
<div class="card stat-card">
<div class="card-body">
<h4>Monthly Expenses</h4>
<h1 id="totalSpending">0</h1>
</div>
</div>
</div>
</div>
<!-- REPORT SECTION -->
<div class="card mt-4">
<div class="card-header">
Monthly Reports
</div>
<div class="card-body">
<div class="row">
<div class="col-md-4">
<select class="form-select">
<option>June 2026</option>
<option>July 2026</option>
<option>August 2026</option>
</select>
</div>
<div class="col-md-8">
<button
class="btn btn-primary"
onclick="downloadAllUsers()">
Download All Users Report
</button>
</div>
</div>
</div>
</div>
<!-- USERS TABLE -->
<div class="card mt-4">
<div class="card-header">
Registered Users
</div>
<div class="table-responsive">
<table class="table card-table table-vcenter">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Last Active</th>
<th>Role</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="usersTable">
</tbody>
</table>
</div>
</div>
</div>
</div>
</div>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
<div class="spinner-overlay" id="spinner">
<div class="spinner"></div>
</div>
<footer class="text-center py-3 border-top mt-5">
<p class="mb-1">
</p>
<a href="snaro.free.nf"
   class="text-decoration-none">
Offical Webpage: Snaro.co
</a>
</footer>

<script src="js/sw-register.js"></script>
</body>
</html>
